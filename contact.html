    <header class="page-header text-center">
        <h1>Contact Our Team</h1>
    </header>

    <main class="container my-4">
        <div class="row g-4">
            <div class="col-md-6">
                <h2>Send a Message</h2>
                <form onsubmit="return confirmFormSubmit();">
                    <div class="mb-3">
                        <label for="fullname" class="form-label">Full Name</label>
                        <input id="fullname" type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Create a Account Password</label>
                        <input id="password" type="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <span class="form-label d-block mb-1">Who are you?</span>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="role-student" name="role" checked>
                            <label class="form-check-label" for="role-student">Student</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="role-parent" name="role">
                            <label class="form-check-label" for="role-parent">Parent</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="size" class="form-label">Usual Sneaker Size</label>
                        <select id="size" class="form-select">
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                            <option>11</option>
                        </select>
                    </div>

                    <div class="mb-3 form-check">
                        <input id="newsletter" type="checkbox" class="form-check-input">
                        <label for="newsletter" class="form-check-label">
                            Sign me up for a email newsletter
                        </label>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" class="form-control" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit Message</button>
                </form>
            </div>

            <div class="col-md-6">
                <h2>Store Location</h2>
                <p>We are located in Cedar City, UT across the street from the university library.</p>
                <div class="ratio ratio-16x9">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101042.056798189!2d-113.10423549999999!3d37.68294505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80b5617fe05ec2d1%3A0xef14cae28073d1e9!2sCedar%20City%2C%20UT!5e0!3m2!1sen!2sus!4v1764908845061!5m2!1sen!2sus"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </main>
